<script>
window.addEventListener('DOMContentLoaded', () => {
  const C = 299792458, AMU = 1.66053907e-27, EV = 1.602176634e-19, KB = 1.380649e-23, MEV_U = 931.494;
  const f = x => x === 0 ? '0' : (Math.abs(x) >= 1e5 || Math.abs(x) < 1e-2 ? x.toExponential(2) : x.toFixed(2));
  const fe = x => x >= 1e6 ? f(x / 1e6) + ' MeV' : x >= 1e3 ? f(x / 1e3) + ' keV' : f(x) + ' eV';
  const g3 = x => x === 0 ? '0' : x.toExponential(3);
  const SUP = { 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
  const sup = k => String(k).split('').map(c => SUP[c]).join('');

  /* ---------- FÍSICA ---------- */
  const LIGHT_B = { '1:1': 2.224, '1:2': 8.482, '2:1': 7.718, '2:2': 28.296 };
  function nuclearBinding(Z, N) { // MeV, fórmula semiempírica de Weizsäcker
    const A = Z + N; if (A < 2 || Z < 1) return 0;
    if (LIGHT_B[Z + ':' + N] !== undefined) return LIGHT_B[Z + ':' + N];
    let d = 0; if (Z % 2 === 0 && N % 2 === 0) d = 11.18 / Math.sqrt(A); else if (Z % 2 && N % 2) d = -11.18 / Math.sqrt(A);
    return Math.max(0, 15.75 * A - 17.8 * Math.pow(A, 2 / 3) - 0.711 * Z * (Z - 1) / Math.cbrt(A) - 23.7 * Math.pow(A - 2 * Z, 2) / A + d);
  }
  const ORDER = [[1,'s'],[2,'s'],[2,'p'],[3,'s'],[3,'p'],[4,'s'],[3,'d'],[4,'p'],[5,'s'],[4,'d'],[5,'p'],[6,'s'],[4,'f'],[5,'d'],[6,'p'],[7,'s'],[5,'f'],[6,'d'],[7,'p'],[8,'s'],[5,'g']];
  const CAP = { s: 2, p: 6, d: 10, f: 14, g: 18 };
  function aufbau(e) { const r = []; let left = e; for (const [n, l] of ORDER) { if (left <= 0) break; const k = Math.min(CAP[l], left); r.push({ n, l, k, cap: CAP[l] }); left -= k; } return r; }
  function levels() { // energía por nivel n con reglas de Slater simplificadase
    const byN = {}; aufbau(model.electrons).forEach(s => byN[s.n] = (byN[s.n] || 0) + s.k);
    const ns = Object.keys(byN).map(Number).sort((a, b) => a - b), Z = model.protons, NS = { 1: 1, 2: 2, 3: 3, 4: 3.7, 5: 4, 6: 4.2, 7: 4.4, 8: 4.6 };
    return ns.map(n => {
      let sh = (byN[n] - 1) * (n === 1 ? 0.30 : 0.35);
      ns.forEach(m => { if (m === n - 1) sh += 0.85 * byN[m]; else if (m < n - 1) sh += byN[m]; });
      const zeff = Math.max(0.5, Z - sh), nn = NS[n] || n;
      return { n, k: byN[n], zeff, E: 13.6057 * zeff * zeff / (nn * nn) };
    });
  }
  const ionizationEV = () => { const l = levels(); return l.length ? l[l.length - 1].E : 13.6; };

  /* ---------- PANEL DE ENERGÍA REAL ---------- */
  const aside = document.querySelector('aside[data-view="laboratory"]');
  const eSec = document.createElement('section');
  eSec.className = 'bg-slate-800 p-5 rounded-xl shadow-lg border border-slate-700';
  eSec.innerHTML = '<h2 class="panel-title text-lg font-bold text-yellow-300 mb-3">Energía real del átomo</h2><div class="real-energy space-y-1 text-xs"></div>';
  aside.prepend(eSec);
  function renderRealEnergy() {
    const Z = model.protons, N = model.neutrons, A = Z + N, B = nuclearBinding(Z, N), lv = levels();
    const Bel = lv.reduce((s, x) => s + x.k * x.E, 0), IE = lv.length ? lv[lv.length - 1].E : 0;
    const u = Z * 1.007825 + N * 1.008665 - B / MEV_U, J = u * AMU * C * C, mol = J * 6.02214076e23 / 1e9;
    const rows = [
      ['Masa del átomo', f(u) + ' u'],
      ['Energía en reposo (mc²)', f(J) + ' J · ' + f(u * MEV_U) + ' MeV'],
      ['Equivalente en calorías', f(J / 4.184) + ' cal'],
      ['Un mol de estos átomos', f(mol) + ' GJ'],
      ['Enlace nuclear', f(B) + ' MeV (' + f(A ? B / A : 0) + ' por nucleón)'],
      ['Enlace electrónico total', fe(Bel)],
      ['1.ª ionización estimada', fe(IE)]
    ];
    if (antimatterMode) rows.push(['Aniquilación con su antiátomo (2mc²)', f(2 * J) + ' J']);
    const html = rows.map(([a, b]) => `<div class="flex justify-between gap-2 border-b border-slate-700 pb-1"><span class="text-slate-400">${a}</span><strong class="text-right text-yellow-200">${b}</strong></div>`).join('') + '<p class="text-[10px] text-slate-600 pt-1">Estimación: fórmula semiempírica de masa (Weizsäcker) y reglas de Slater.</p>';
    document.querySelectorAll('.real-energy').forEach(el => el.innerHTML = html);
  }

  /* ---------- PESTAÑA EXPERIMENTOS ---------- */
  const nav = document.querySelector('nav');
  const tab = document.createElement('button');
  tab.id = 'experiments-tab'; tab.type = 'button'; tab.textContent = 'Experimentos';
  tab.className = 'px-3 py-2 rounded-md text-sm font-semibold text-slate-300 hover:bg-slate-700';
  tab.onclick = () => window.showView('experiments');
  nav.insertBefore(tab, $('particles-tab'));
  const find = t => [...document.querySelectorAll('section')].find(s => s.querySelector('h2')?.textContent.includes(t));
  const view = document.createElement('section');
  view.id = 'experiments-view'; view.dataset.view = 'experiments'; view.className = 'hidden col-span-12';
  view.innerHTML = `<div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <div id="exp-left" class="lg:col-span-4 flex flex-col gap-6"></div>
    <div class="lg:col-span-5 bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 flex flex-col items-center">
      <h2 class="text-lg font-bold text-orange-300">Cámara de experimentos</h2>
      <div id="exp-title" class="text-xs text-slate-300 mt-1"></div>
      <div class="hologram-display w-full max-w-[420px] mt-3"><svg id="exp-canvas" viewBox="0 0 400 400" class="w-full h-auto overflow-visible"></svg><div class="hologram-scanlines"></div></div>
      <div id="exp-process" class="grid grid-cols-2 gap-2 w-full mt-3 text-xs"></div>
      <div id="exp-last" class="w-full mt-3 p-3 rounded-lg bg-slate-900/70 border border-slate-700 text-sm text-slate-300">Ejecuta un experimento para ver su efecto sobre el átomo.</div>
    </div>
    <div id="exp-right" class="lg:col-span-3 flex flex-col gap-6">
      <section class="bg-slate-800 p-5 rounded-xl shadow-lg border border-slate-700"><h2 class="text-lg font-bold text-yellow-300 mb-3">Energía real del átomo</h2><div class="real-energy space-y-1 text-xs"></div></section>
    </div></div>`;
  document.querySelector('header').after(view);
  ['Factores y reacciones', 'Experimentos de colisión', 'Desintegración radiactiva', 'Experimentos de partículas'].forEach(t => { const s = find(t); if (s) $('exp-left').appendChild(s); });
  const reg = find('Registro de experimentos'); if (reg) $('exp-right').appendChild(reg);

  function mirror() {
    const a = $('atom-canvas'), b = $('exp-canvas'); if (!b) return;
    b.innerHTML = a.innerHTML.replace(/id="([\w-]+)"/g, 'id="e-$1"').replace(/url\(#([\w-]+)\)/g, 'url(#e-$1)');
    b.setAttribute('class', 'w-full h-auto overflow-visible' + (a.classList.contains('hologram-active') ? ' hologram-active' : ''));
    $('exp-title').innerHTML = `<strong class="text-orange-200">${selected.name}</strong> · p${model.protons} n${model.neutrons} e${model.electrons} · ${$('representation-label').textContent}`;
  }
  ['collision-result', 'decay-result', 'particle-experiment-result', 'factor-result'].forEach(id =>
    new MutationObserver(() => { $('exp-last').innerHTML = $(id).innerHTML; mirror(); }).observe($(id), { childList: true }));

  const oShow = showView;
  showView = function (v) {
    oShow(v);
    tab.className = 'px-3 py-2 rounded-md text-sm font-semibold ' + (v === 'experiments' ? 'bg-orange-600 text-white' : 'text-slate-300 hover:bg-slate-700');
    if (v === 'experiments') { mirror(); renderRealEnergy(); updateEnergyDisplay(); }
  };

  /* ---------- MODELO DE DALTON ---------- */
  $('representation-selector').insertBefore(new Option('Dalton: esfera maciza', 'dalton'), $('representation-selector').options[0]);
  function dalton() {
    const z = model.protons, A = z + model.neutrons, c = antimatterMode ? '#f472b6' : `hsl(${(z * 47) % 360} 70% 55%)`;
    const r = Math.min(105, 40 + Math.cbrt(A) * 11), sym = z === selected.z ? selected.symbol : 'X';
    let s = `<defs><radialGradient id="dalton-g" cx=".35" cy=".3"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".35" stop-color="${c}"/><stop offset="1" stop-color="#0f172a"/></radialGradient></defs>`;
    s += `<circle cx="200" cy="170" r="${r.toFixed(1)}" fill="url(#dalton-g)" stroke="#e2e8f0" stroke-opacity=".4"${antimatterMode ? ' stroke-dasharray="6 5"' : ''}><title>Átomo indivisible</title></circle>`;
    s += `<text x="200" y="${(180).toFixed(0)}" text-anchor="middle" fill="#0f172a" font-size="${r > 70 ? 44 : 32}" font-weight="900">${sym}</text>`;
    [140, 200, 260].forEach(x => s += `<circle cx="${x}" cy="318" r="14" fill="url(#dalton-g)" stroke="#e2e8f0" stroke-opacity=".3"/>`);
    s += `<text x="200" y="356" text-anchor="middle" fill="#cbd5e1" font-size="11">Átomo indivisible y macizo · masa relativa ${A}</text><text x="200" y="372" text-anchor="middle" fill="#64748b" font-size="10">Los átomos de un mismo elemento son idénticos (Dalton, 1803)</text>`;
    return s;
  }

  /* ---------- MODELO CUÁNTICO MEJORADO ---------- */
  const LC = { s: '#67e8f9', p: '#a78bfa', d: '#f472b6', f: '#fbbf24', g: '#4ade80' }, LOBES = { p: 2, d: 4, f: 6, g: 8 };
  function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function quantum() {
    const sub = aufbau(model.electrons), lv = levels(), CX = 200, CY = 205, rad = n => 14 + 16.5 * n;
    let o = '<defs><radialGradient id="q-nuc"><stop stop-color="#fff"/><stop offset=".4" stop-color="#38bdf8"/><stop offset="1" stop-color="#0f172a"/></radialGradient></defs><rect x="18" y="18" width="364" height="364" rx="18" fill="#07111f" stroke="#1e3a5f"/><text x="200" y="38" text-anchor="middle" fill="#bae6fd" font-size="11" font-weight="bold">ORBITALES · NUBE DE PROBABILIDAD</text>';
    const byN = {}; sub.forEach(s => (byN[s.n] = byN[s.n] || []).push(s));
    Object.keys(byN).forEach((key, gi) => {
      const n = +key, R = rad(n);
      o += `<g class="quantum-cloud ${gi % 2 ? 'quantum-cloud-delay' : ''}"><circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#334155" stroke-dasharray="2 6"/>`;
      byN[n].forEach(s => {
        const nO = s.cap / 2, rnd = rng(n * 131 + s.l.charCodeAt(0) * 7 + s.k), col = LC[s.l];
        o += `<g><title>${n}${s.l} · ${s.k} e⁻ (${nO} orbital${nO > 1 ? 'es' : ''})</title>`;
        for (let m = 0; m < nO; m++) {
          const occ = (s.k > m ? 1 : 0) + (s.k > m + nO ? 1 : 0); if (!occ) continue;
          if (s.l === 's') {
            o += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="${col}" fill-opacity="${(.04 + occ * .05).toFixed(2)}" stroke="${col}" stroke-opacity=".35"/>`;
            for (let i = 0; i < occ * 18; i++) { const a = rnd() * 6.2832, rr = R * (.3 + .7 * rnd()); o += `<circle cx="${(CX + Math.cos(a) * rr).toFixed(1)}" cy="${(CY + Math.sin(a) * rr).toFixed(1)}" r="1.6" fill="${col}" fill-opacity="${(.4 + .5 * rnd()).toFixed(2)}"/>`; }
          } else {
            const L = LOBES[s.l], base = m * (180 / nO), rx = R * .45 / (1 + (L - 2) * .14), ry = rx * .42;
            for (let j = 0; j < L; j++) {
              const ang = base + j * 360 / L, th = ang * Math.PI / 180, cx = CX + Math.cos(th) * R * .55, cy = CY + Math.sin(th) * R * .55;
              o += `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" transform="rotate(${ang.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)})" fill="${col}" fill-opacity="${(.08 + occ * .1).toFixed(2)}" stroke="${col}" stroke-opacity=".5"/>`;
              for (let i = 0; i < occ * 4; i++) { const u = Math.sqrt(rnd()), t = rnd() * 6.2832, px = Math.cos(t) * u * rx, py = Math.sin(t) * u * ry; o += `<circle cx="${(cx + px * Math.cos(th) - py * Math.sin(th)).toFixed(1)}" cy="${(cy + px * Math.sin(th) + py * Math.cos(th)).toFixed(1)}" r="1.4" fill="${col}" fill-opacity=".85"/>`; }
            }
          }
        }
        o += '</g>';
      });
      o += '</g>';
    });
    const maxN = Math.max(...Object.keys(byN).map(Number));
    if (factorApplied && (activeFactor === 'light' || activeFactor === 'temperature')) {
      const R = Math.min(150, rad(maxN + 1));
      o += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#fde047" stroke-dasharray="4 5" stroke-opacity=".7"/><g><animateTransform attributeName="transform" type="rotate" from="0 ${CX} ${CY}" to="360 ${CX} ${CY}" dur="3s" repeatCount="indefinite"/><circle cx="${CX + R}" cy="${CY}" r="5" fill="#fde047"><title>Electrón excitado</title></circle></g>`;
    }
    o += `<circle cx="${CX}" cy="${CY}" r="11" fill="url(#q-nuc)" stroke="#e0f2fe"><title>Núcleo: ${model.protons} p, ${model.neutrons} n</title></circle>`;
    lv.forEach((l, i) => o += `<text x="26" y="${58 + i * 11}" fill="#94a3b8" font-size="8">n=${l.n}  −${fe(l.E)}</text>`);
    const cfg = sub.slice(-7).map(s => `${s.n}${s.l}${sup(s.k)}`).join(' ');
    o += ['s', 'p', 'd', 'f', 'g'].map((l, i) => `<text x="${30 + i * 40}" y="352" fill="${LC[l]}" font-size="10">● ${l}</text>`).join('');
    o += `<text x="200" y="371" text-anchor="middle" fill="#cbd5e1" font-size="10">${sub.length > 7 ? '… ' : ''}${cfg}</text>`;
    return o;
  }

  /* ---------- REDIBUJADO ---------- */
  const oRedraw = redraw;
  redraw = function () {
    const rep = representation;
    if (rep !== 'dalton' && rep !== 'quantum') oRedraw();
    else {
      representation = 'rutherford'; oRedraw(); representation = rep;
      const svg = $('atom-canvas'), h = svg.innerHTML, i = h.indexOf('<circle cx="200" cy="200" r="38"');
      svg.innerHTML = (i > 0 ? h.slice(0, i) : '') + (rep === 'dalton' ? dalton() : quantum());
    }
    mirror();
  };
  const oRep = setRepresentation;
  setRepresentation = function (v) {
    oRep(v); $('representation-selector').value = v;
    if (v === 'dalton') $('representation-label').textContent = 'Modelo de Dalton';
    mirror();
  };
  const oDetails = updateDetails;
  updateDetails = function () { oDetails(); renderRealEnergy(); };

  /* ---------- ENERGÍA DEL PROCESO ---------- */
  updateEnergyDisplay = function () {
    $('energy-rate').textContent = g3(energyRate) + ' W';
    $('energy-joules').textContent = g3(energyRate) + ' J/s';
    $('energy-calories').textContent = g3(energyRate / 4.184) + ' cal/s';
    $('energy-gigajoules').textContent = g3(energyRate / 1e9) + ' GJ/s';
    $('energy-detail').textContent = energySource;
    const p = $('exp-process');
    if (p) p.innerHTML = [['Potencia (1 evento/s)', g3(energyRate) + ' W'], ['Energía', energyRate ? fe(energyRate / EV) : '0 eV'], ['Calorías', g3(energyRate / 4.184) + ' cal/s'], ['Gigajulios', g3(energyRate / 1e9) + ' GJ/s']]
      .map(([a, b]) => `<div class="bg-slate-900/70 p-2 rounded"><span class="block text-slate-500">${a}</span><strong class="text-yellow-200">${b}</strong></div>`).join('') + `<p class="col-span-2 text-[11px] text-slate-500">${energySource}</p>`;
  };
  const addNote = (id, html) => { $(id).insertAdjacentHTML('beforeend', `<p class="mt-2 text-xs text-yellow-300">${html}</p>`); };

  const oColl = runCollisionExperiment;
  runCollisionExperiment = function () {
    oColl();
    const t = PERIODIC_ELEMENTS.find(e => e.z === Number($('experiment-target').value)) || PERIODIC_ELEMENTS[1];
    const mA = (model.protons + model.neutrons) * AMU, mT = Math.round(t.mass) * AMU, ty = collisionExperiment.type;
    let E;
    if (ty === 'annihilation') E = (mA + mT) * C * C;
    else { const v = collisionParameters.speed / 100 * 0.05 * C * Math.cos(collisionParameters.angle * Math.PI / 180); E = .5 * (mA * mT / (mA + mT)) * v * v; }
    energyRate = E;
    energySource = ty === 'annihilation' ? 'Aniquilación: E = (m₁ + m₂)·c² (masa real de ambos átomos).' : `Energía cinética relativa de choque (v hasta 5 % de c, ángulo ${collisionParameters.angle}°).`;
    updateEnergyDisplay();
    addNote('collision-result', `Energía liberada: ${f(E)} J (${fe(E / EV)})`);
  };

  const oDecay = runDecayExperiment;
  runDecayExperiment = function () {
    const t = $('decay-type').value, p0 = model.protons, n0 = model.neutrons;
    oDecay();
    const changed = p0 !== model.protons || n0 !== model.neutrons, Bd = nuclearBinding(model.protons, model.neutrons), Bp = nuclearBinding(p0, n0);
    let Q = 0;
    if (changed) Q = t === 'alpha' ? Bd + 28.296 - Bp : t === 'beta-minus' ? Bd - Bp + 0.782 : t === 'beta-plus' ? Bd - Bp - 1.804 : 0;
    if (t === 'gamma') Q = 0.5;
    energyRate = Math.max(0, Q) * 1e6 * EV;
    energySource = `Q de la desintegración ${t} por fórmula semiempírica (1 evento/s).`;
    updateEnergyDisplay();
    addNote('decay-result', `Energía liberada Q = ${f(Q)} MeV${changed && Q < 0 ? ' (negativa: en la naturaleza este decaimiento no ocurriría espontáneamente)' : t === 'gamma' ? ' (valor ilustrativo)' : ''}`);
  };

  const oPart = runParticleExperiment;
  runParticleExperiment = function () {
    oPart();
    const t = $('particle-experiment').value, MeV = { pair: 1.022, 'muon-decay': 105.15, 'annihilation-pair': 1.022, feynman: 0 }[t];
    energyRate = MeV * 1e6 * EV;
    energySource = t === 'feynman' ? 'Intercambio de fotón virtual: sin energía neta liberada.' : 'Energía de masa real de las partículas implicadas (E = mc²).';
    updateEnergyDisplay();
    addNote('particle-experiment-result', `Energía: ${f(MeV)} MeV`);
  };

  const oFactor = applyFactor;
  applyFactor = function () {
    const IE = ionizationEV(), I = factorIntensity, m = (model.protons + model.neutrons) * AMU;
    oFactor();
    let J = 0, note = '', eV = 0;
    if (activeFactor === 'temperature') { J = 1.5 * KB * I * 100; note = `T = ${I * 100} K → energía térmica media ${fe(J / EV)}`; }
    else if (activeFactor === 'pressure') J = 1.5 * KB * (300 + I * 3);
    else if (activeFactor === 'light') { eV = I * .3; J = eV * EV; note = `Fotón de ${fe(eV)}`; }
    else if (activeFactor === 'electricity') { eV = I * .5; J = eV * EV; note = `Potencial de ${fe(eV)}`; }
    else if (activeFactor === 'collision') { const v = I * 10; J = .5 * m * v * v; note = `Velocidad ${v} m/s`; }
    else if (activeFactor === 'particle') J = nuclearBinding(model.protons, model.neutrons) > 0 ? (nuclearBinding(model.protons, model.neutrons) - nuclearBinding(model.protons, Math.max(0, model.neutrons - 1))) * 1e6 * EV : 0;
    else if (activeFactor === 'magnetic') { eV = 5.788e-5 * I / 10; J = eV * EV; note = `B = ${(I / 10).toFixed(1)} T (desdoblamiento Zeeman)`; }
    energyRate = J;
    energySource = `${FACTORS[activeFactor].name}: energía aportada calculada con valores físicos reales.`;
    updateEnergyDisplay();
    if (eV) note += ` · ionización estimada ${fe(IE)} → ${eV >= IE ? 'SÍ ioniza' : 'no ioniza'}`;
    addNote('factor-result', note || `Energía aportada: ${fe(J / EV)}`);
  };

  updateDetails(); redraw(); updateEnergyDisplay();
});
</script>
